# Waveforms were generated on 2026-06-26--27 and the surviving manifests were
# finalized on 2026-06-28. Hub repositories whose latest commit predates that
# run and whose weights have not changed since can be identified exactly, but
# those reconstructed revisions are not falsely labeled as run-attested.
# Local artifact hashes are recorded for non-Hugging-Face loaders.
# Stochastic seeds that were not set in the original run are marked explicitly;
# those systems are checkpoint-reproducible but not waveform-bit-reproducible.

