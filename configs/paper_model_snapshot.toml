# Best-available synthesis/evaluator snapshot for the FLEURS paper experiment.
#
# Waveforms were generated on 2026-06-26--27 and the surviving manifests were
# finalized on 2026-06-28. Hub repositories whose latest commit predates that
# run and whose weights have not changed since can be identified exactly, but
# those reconstructed revisions are not falsely labeled as run-attested.
# Local artifact hashes are recorded for non-Hugging-Face loaders.
# Stochastic seeds that were not set in the original run are marked explicitly;
# those systems are checkpoint-reproducible but not waveform-bit-reproducible.

snapshot_date = "2026-06-28"
torch = "2.11.0+cu130"
cuda_runtime_reported_by_torch = "13.0"
gpu = "NVIDIA GeForce RTX 4080 Laptop GPU"
python = "3.11"

[benchmark_data]
dataset = "google/fleurs"
dataset_revision = "not recorded by the historical config generator"
split = "validation"
languages = ["en_us", "ru_ru", "cmn_hans_cn"]
voices_per_language = 10
targets_per_language = 10
max_voice_chars = 120
max_target_chars = 110
min_target_chars = "unset"
selection = "deterministic first rows after filtering"

[speaker_calibration]
dataset = "Mozilla Common Voice Scripted Speech 26.0"
split = "validated"
locales = ["en", "ru", "zh-CN"]
